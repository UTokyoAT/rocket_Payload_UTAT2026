[agent]
  interval = "1s"
  flush_interval = "1s"
  omit_hostname = true

[[outputs.influxdb_v2]]
  urls = ["http://influxdb:8086"]
  token = "${INFLUXDB_INIT_ADMIN_TOKEN}"
  organization = "${INFLUXDB_INIT_ORG}"
  bucket = "${INFLUXDB_INIT_BUCKET}"

# ---------------------------------------------------------------------------
# 本番: ESP32-S3から10HzでpublishされるEKF統合レコード (lib/Telemetry の publishRecord)
#   topic: rocket/telemetry   measurement: rocket_telemetry
# センサー故障・GNSS未取得などで欠けたフィールドは送信側が省略するため、
# 各フィールドは optional = true とし、あるものだけ書き込む。
#
# ポイントの時刻(_time)はTelegrafの受信時刻。ロボットは絶対時刻を持たず、
# 起動からの経過時間 uptime_ms と連番 seq をフィールドとして送る。
# 通信断からの再送分は受信時刻がずれるため、走行後の解析では _time ではなく
# uptime_ms(時間軸)と seq(欠落・重複の検出)を使うこと。ロボットを再起動すると
# 両方とも0から数え直す。
# ---------------------------------------------------------------------------
[[inputs.mqtt_consumer]]
  servers = ["tcp://mosquitto:1883"]
  topics = ["rocket/telemetry"]
  qos = 1
  client_id = "telegraf-rocket"
  data_format = "json_v2"

  [[inputs.mqtt_consumer.json_v2]]
    measurement_name = "rocket_telemetry"

    [[inputs.mqtt_consumer.json_v2.field]]
      path = "seq"
      type = "int"
      optional = true
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "uptime_ms"
      type = "int"
      optional = true

    # 位置
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "pos.lat"
      rename = "pos_lat"
      type = "float"
      optional = true
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "pos.lon"
      rename = "pos_lon"
      type = "float"
      optional = true
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "pos.alt"
      rename = "pos_alt"
      type = "float"
      optional = true

    # IMU(6軸)
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "imu.ax"
      rename = "imu_ax"
      type = "float"
      optional = true
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "imu.ay"
      rename = "imu_ay"
      type = "float"
      optional = true
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "imu.az"
      rename = "imu_az"
      type = "float"
      optional = true
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "imu.gx"
      rename = "imu_gx"
      type = "float"
      optional = true
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "imu.gy"
      rename = "imu_gy"
      type = "float"
      optional = true
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "imu.gz"
      rename = "imu_gz"
      type = "float"
      optional = true

    # 気圧センサー
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "baro.pressure_hpa"
      rename = "baro_pressure_hpa"
      type = "float"
      optional = true
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "baro.alt_m"
      rename = "baro_alt_m"
      type = "float"
      optional = true

    # エンコーダー(モーター回転数)
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "encoder.right_rev"
      rename = "encoder_right_rev"
      type = "float"
      optional = true
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "encoder.left_rev"
      rename = "encoder_left_rev"
      type = "float"
      optional = true

    # GNSS測位品質
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "gnss.fix"
      rename = "gnss_fix"
      type = "int"
      optional = true
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "gnss.hdop"
      rename = "gnss_hdop"
      type = "float"
      optional = true
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "gnss.sats"
      rename = "gnss_sats"
      type = "int"
      optional = true

    # EKF推定結果
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "EKF.position_N"
      rename = "ekf_position_n"
      type = "float"
      optional = true
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "EKF.position_E"
      rename = "ekf_position_e"
      type = "float"
      optional = true
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "EKF.speed"
      rename = "ekf_speed"
      type = "float"
      optional = true
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "EKF.azimuth"
      rename = "ekf_azimuth"
      type = "float"
      optional = true
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "EKF.bias_accel"
      rename = "ekf_bias_accel"
      type = "float"
      optional = true
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "EKF.bias_gyro"
      rename = "ekf_bias_gyro"
      type = "float"
      optional = true

# ---------------------------------------------------------------------------
# 切り分けテスト: lib/Telemetry の sendTest(name, {...}) が送る任意フィールド
#   topic: rocket/test/<name>   measurement: rocket_test   tag: test_name=<name>
# フィールドは送られてきた数値をそのまま保存する(スキーマ固定なし)。
# 時刻はTelegrafの受信時刻。送信側の起動からの経過時間は uptime_ms フィールドに入る。
# ---------------------------------------------------------------------------
[[inputs.mqtt_consumer]]
  servers = ["tcp://mosquitto:1883"]
  topics = ["rocket/test/+"]
  qos = 0
  client_id = "telegraf-rocket-test"
  data_format = "json"
  name_override = "rocket_test"

  [[inputs.mqtt_consumer.topic_parsing]]
    topic = "rocket/test/+"
    tags = "_/_/test_name"

# ---------------------------------------------------------------------------
# ログ: lib/Telemetry の log() が送るテキスト1行
#   topic: rocket/log   measurement: rocket_log   field: value(文字列)
# ---------------------------------------------------------------------------
[[inputs.mqtt_consumer]]
  servers = ["tcp://mosquitto:1883"]
  topics = ["rocket/log"]
  qos = 0
  client_id = "telegraf-rocket-log"
  data_format = "value"
  data_type = "string"
  name_override = "rocket_log"
