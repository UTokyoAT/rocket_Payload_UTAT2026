; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[common]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
build_flags = 
	-DBOARD_HAS_PSRAM
	-Iinclude
board_build.arduino.memory_type = qio_opi
lib_deps = 
	mikalhart/TinyGPSPlus
	adafruit/Adafruit BMP280 Library
	adafruit/Adafruit MPU6050
	adafruit/Adafruit Unified Sensor
	adafruit/Adafruit BusIO
    adafruit/Adafruit MCP23017 Arduino Library@^2.3.2
board_upload.flash_size = 8MB
board_build.partitions = default_8MB.csv

[env:test-bmp280]
extends = common
build_src_filter = -<*> +<../tests/test_bmp280/>

[env:test-mpu6050]
extends = common
build_src_filter = -<*> +<../tests/test_mpu6050/>

[env:test-motor]
extends = common
build_src_filter = -<*> +<../tests/test_motor/> +<Actuator/>
build_flags =
	${common.build_flags}
	-Isrc/Actuator

[env:test-gps]
extends = common
build_src_filter = -<*> +<../tests/test_gps/>
lib_deps =
	mikalhart/TinyGPSPlus
	adafruit/Adafruit MCP23017 Arduino Library@^2.3.2

[env:test-nichrome]
extends = common
build_src_filter = -<*> +<../tests/test_nichrome/> +<Deployer/> +<LED/>
build_flags =
	${common.build_flags}
	-Isrc/Deployer
	-Isrc/LED

[env:test-telemetry]
extends = common
build_src_filter = -<*> +<../tests/test_telemetry/>
lib_deps =

[env:mission]
extends = common
build_src_filter = -<*> +<../tests/test_mission/> +<Actuator/> +<MotorController/>
build_flags =
	${common.build_flags}
	-Isrc/Actuator
	-Isrc/MotorController
